

    <script>
        function updateGameData() {
            const now = new Date();
            
            // আসল গেমের পিরিয়ডের সাথে মিল রাখার জন্য অফসেট ক্যালকুলেশন
            // বর্তমান সময় থেকে মোট মিনিট হিসাব করে গেমের ফরম্যাটে রূপান্তর
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const diffMinutes = Math.floor((now - startOfDay) / 60000);
            
            // গেমের বেস পিরিয়ড ফরম্যাট (YYYYMMDD1000 + সিরিয়াল)
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            
            // গেম সাইটের সাথে মিল করার জন্য পিরিয়ড নম্বর বেস
            const basePeriodNumber = 11000 + diffMinutes; 
            const exactPeriodString = `${year}${month}${day}1000${basePeriodNumber}`;
            
            // কাউন্টডাউন টাইমার (সেকেন্ড মিলকরণ)
            const seconds = now.getSeconds();
            const remainingSeconds = 59 - seconds;
            document.getElementById("timer").innerText = `00:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;

            document.getElementById("period").innerText = `Period: ${exactPeriodString}`;

            // সিগন্যাল লজিক
            generateSignal(exactPeriodString);
        }

        function generateSignal(periodStr) {
            const lastDigit = parseInt(periodStr.slice(-1));
            const secondLastDigit = parseInt(periodStr.slice(-2, -1));
            let randomNum = (lastDigit + secondLastDigit) % 10;
            
            let signalText = randomNum >= 5 ? `BIG (${randomNum}) <span style="color:#ef4444;">●</span>` : `SMALL (${randomNum}) <span style="color:#22c55e;">●</span>`;
            document.getElementById("signal").innerHTML = signalText;
        }

        setInterval(updateGameData, 1000);
        updateGameData();
    </script>
