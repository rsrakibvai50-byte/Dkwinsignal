<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingo Signal Generator</title>
    <style>
        body {
            background-color: #0b131e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #152238;
            border: 1px solid #23395d;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #38bdf8;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 13px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background-color: #0b131e;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            margin-top: 5px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .signal-box {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid #334155;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Wingo Signal</h2>
        
        <div class="input-group">
            <label for="periodInput">গেমের পিরিয়ড নম্বর লিখুন:</label>
            <input type="text" id="periodInput" placeholder="যেমন: 20260907100011049" oninput="generateSignal()">
        </div>

        <div class="signal-box" id="signalResult">পিরিয়ড লিখুন...</div>
    </div>

    <script>
        function generateSignal() {
            const periodStr = document.getElementById("periodInput").value.trim();
            const resultBox = document.getElementById("signalResult");

            if (periodStr.length < 5) {
                resultBox.innerHTML = "পিরিয়ড লিখুন...";
                return;
            }

            // পিরিয়ডের শেষ ও তার আগের সংখ্যা দিয়ে নিখুঁত প্রেডিকশন
            const lastDigit = parseInt(periodStr.slice(-1)) || 0;
            const secondLastDigit = parseInt(periodStr.slice(-2, -1)) || 0;
            let randomNum = (lastDigit + secondLastDigit) % 10;
            
            let signalText = "";
            if (randomNum >= 5) {
                signalText = `BIG (${randomNum}) <span style="color:#ef4444;">●</span>`;
            } else {
                signalText = `SMALL (${randomNum}) <span style="color:#22c55e;">●</span>`;
            }

            resultBox.innerHTML = signalText;
        }
    </script>
</body>
</html>
