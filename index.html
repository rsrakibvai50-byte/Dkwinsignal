<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingo 1 Min Signal</title>
    <style>
        body {
            background-color: #0b131e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #152238;
            border: 1px solid #23395d;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { margin-bottom: 10px; font-size: 20px; color: #38bdf8; }
        .timer { font-size: 24px; font-weight: bold; color: #f59e0b; margin: 10px 0; }
        .period { font-size: 13px; color: #94a3b8; margin-bottom: 15px; }
        .signal-box {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Wingo 1 Min Signal</h2>
        <div class="timer" id="timer">00:00</div>
        <div class="period" id="period">Period: Syncing...</div>
        <div class="signal-box" id="signal">WAITING...</div>
    </div>

    <script>
        function updateSignal() {
            const now = new Date();
            
            // আপনার গেমের পিরিয়ডের সাথে টাইম জোন এবং অফসেট অ্যাডজাস্টমেন্ট
            const utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
            const bdTime = new Date(utcTime + (3600000 * 6)); // Bangladesh Time (GMT+6)
            
            const year = bdTime.getFullYear();
            const month = String(bdTime.getMonth() + 1).padStart(2, '0');
            const day = String(bdTime.getDate()).padStart(2, '0');
            
            const startOfDay = new Date(bdTime.getFullYear(), bdTime.getMonth(), bdTime.getDate());
            const minutesPassed = Math.floor((bdTime - startOfDay) / 60000);
            
            // আপনার গেমের পিরিয়ড নাম্বারের সাথে নিখুঁত মিল করার ম্যাজিক বেস
            const baseNumber = 1000000000 + 11000; 
            const totalPeriodCode = `${year}${month}${day}${baseNumber + minutesPassed}`;

            // কাউন্টডাউন টাইমার
            const seconds = bdTime.getSeconds();
            const remSec = 59 - seconds;
            document.getElementById("timer").innerText = `00:${remSec < 10 ? '0' : ''}${remSec}`;
            document.getElementById("period").innerText = `Period: ${totalPeriodCode}`;

            // সিগন্যাল লজিক
            const lastDigit = parseInt(totalPeriodCode.slice(-1));
            const secondLast = parseInt(totalPeriodCode.slice(-2, -1));
            const sum = (lastDigit + secondLast) % 10;

            let resultHTML = sum >= 5 ? `BIG (${sum}) <span style="color:#ef4444;">●</span>` : `SMALL (${sum}) <span style="color:#22c55e;">●</span>`;
            document.getElementById("signal").innerHTML = resultHTML;
        }

        setInterval(updateSignal, 1000);
        updateSignal();
    </script>
</body>
</html>
